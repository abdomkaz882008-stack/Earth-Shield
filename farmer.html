<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أوامر اليوم - طهطا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#040f0d;color:#fff;font-family:'Cairo',sans-serif}
.wrap{max-width:480px;margin:auto;padding:12px}
.top{font-size:11px;color:#8fb8a8;text-align:left;margin-bottom:8px}
.card{background:linear-gradient(180deg,#143027,#0b1d18);border:1px solid #1e3d32;border-radius:28px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{margin:0;text-align:center;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.box{background:#0e1d18;border:1px solid #1a332c;border-radius:14px;padding:12px;text-align:center}
.box div{font-size:12px;color:#7aa898}
.box b{font-size:18px;color:#d6ff80}
.adv{margin-top:14px;background:#0a1814;border:1px solid #1a332c;border-radius:18px;padding:16px}
.adv b{font-size:20px;display:block;margin-top:6px}
.nav{display:flex;gap:8px;margin-top:14px}
.nav a{flex:1;text-align:center;padding:12px;border-radius:14px;text-decoration:none;background:#0e1d18;border:1px solid #1a332c;color:#6b8a80;font-weight:800}
.nav a.active{color:#d6ff80;border-color:#d6ff80;background:#142a22}
</style>
</head>
<body>
<div class="wrap">
<div class="top">📶 متصل بالقمر - تحديث مباشر - NASA POWER</div>
<div class="card">
<h1>أوامر اليوم - طهطا</h1>
<div class="grid">
<div class="box"><div>حرارة</div><b id="t">--</b></div>
<div class="box"><div>رطوبة</div><b id="h">--</b></div>
<div class="box"><div>مطر</div><b id="p">--</b></div>
</div>
<div class="adv">
<div>💡 نصيحة اليوم</div>
<b id="adv">⏳ جاري التحليل من قمر ناسا...</b>
</div>
</div>
<div class="nav">
<a class="active" href="./farmer.html">🌱 فلاح</a>
<a href="./index.html">🔬 عالم</a>
<a href="./picnic.html">👤 خروجة</a>
</div>
</div>
<script>
const LAT=26.77,LON=31.50;
fetch(`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,RH2M,PRECTOTCORR&community=AG&longitude=${LON}&latitude=${LAT}&start=20250925&end=20250929&format=JSON`)
.then(r=>r.json()).then(d=>{
let keys=Object.keys(d.properties.parameter.T2M);
let k=keys[keys.length-1];
let t=d.properties.parameter.T2M[k];
let h=d.properties.parameter.RH2M[k];
let p=d.properties.parameter.PRECTOTCORR[k];
document.getElementById('t').innerText=t+'°C';
document.getElementById('h').innerText=h+'%';
document.getElementById('p').innerText=p+' mm';
let txt=p>1?'⚠️ وقف الري - في مطر متوقع':h<30?'⚠️ زود الري - الجو جاف':'✅ ري طبيعي اليوم - الجو مستقر';
document.getElementById('adv').innerText=txt;
}).catch(()=>{document.getElementById('adv').innerText='❌ مفيش نت - افتح النت عشان بيانات القمر';});
</script>
</body>
</html>
