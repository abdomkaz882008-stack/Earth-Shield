<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>درع الأرض - الفلاح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#0a1a14;color:#e8ffe8}
.wrap{max-width:520px;margin:auto;padding:14px}
.top-nav{display:flex;gap:8px;margin-bottom:14px}
.top-nav a{flex:1;text-align:center;padding:10px;border-radius:14px;text-decoration:none;background:#132a1f;border:1px solid #1e4d2b;color:#8fb8a8;font-weight:800}
.top-nav a.active{background:#d6ff80;color:#000;border-color:#d6ff80}
.card{background:#11261c;border:1px solid #1e4d2b;border-radius:18px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:800;color:#d6ff80}
.small{font-size:12px;color:#8fb8a8}
#last_update{font-size:11px;color:#8fb8a8;text-align:center;margin:8px 0}
.btn{width:100%;padding:12px;border-radius:14px;border:none;font-weight:800;cursor:pointer}
.btn-refresh{background:#d6ff80;color:#000;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="top-nav">
<a href="./index.html">🔬 عالم</a>
<a class="active" href="./farmer.html">🌱 فلاح</a>
<a href="./picnic.html">🏖️ خروجة</a>
</div>

<div class="card">
<h3 style="margin:0">🌡️ أوامر اليوم - طهطا</h3>
<div id="last_update">⏳ بنحدث من القمر...</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div>الحرارة<div class="big" id="t">--</div></div>
<div>الرطوبة<div class="big" id="h">--</div></div>
<div>المطر<div class="big" id="p">--</div></div>
<div>الرياح<div class="big" id="w">--</div></div>
</div>
<button class="btn btn-refresh" onclick="fetchData(true)">🔄 تحديث الآن</button>
<div id="advise" class="small" style="margin-top:12px;background:#0f2a1c;padding:10px;border-radius:10px">نصيحة:...</div>
</div>
</div>

<script>
async function fetchData(force=false){
  const el = document.getElementById('last_update');
  el.innerText = '⏳ بنحدث من القمر...';
  const directUrl = `https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,RH2M,PRECTOTCORR,WS2M&community=RE&longitude=31.5&latitude=26.7&start=20250928&end=20250929&format=JSON`;
  try{
    let res = await fetch(directUrl, {cache:'no-store'});
    let d = await res.json();
    let k = Object.keys(d.properties.parameter.T2M).pop();
    let temp = d.properties.parameter.T2M[k];
    let hum = d.properties.parameter.RH2M[k];
    let prec = d.properties.parameter.PRECTOTCORR[k];
    let wind = d.properties.parameter.WS2M[k];
    document.getElementById('t').innerText = temp + '°C';
    document.getElementById('h').innerText = hum + '%';
    document.getElementById('p').innerText = prec + ' mm';
    document.getElementById('w').innerText = wind + ' m/s';
    el.innerText = '🛰️ آخر تحديث: ' + new Date().toLocaleString('ar-EG') + ' - LIVE';
    document.getElementById('advise').innerText = prec>1? '🌧️ في مطر - أجل الري' : temp>35? '
