kind = "web"
previewPath = "/"
title = "Earth Shield"
description = "A bilingual NASA Earth-observation dashboard for Tahta, Egypt with live agriculture, fire, ground movement, and water intelligence layers over a dark Leaflet map."
version = "1.0.0"
id = "artifacts/earth-shield"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24236

[services.development]
run = "pnpm --filter @workspace/earth-shield run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earth-shield", "run", "build" ]
serve = "static"
publicDir = "artifacts/earth-shield/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24236"
BASE_PATH = "/"
