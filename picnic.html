<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH SHIELD - User</title>
<style>
body{background:#0a1210;color:#fff;font-family:sans-serif;margin:0;padding:15px}
.nav{display:flex;gap:10px;margin-bottom:20px}
.nav a{padding:10px 18px;border-radius:20px;text-decoration:none;color:#aaa;border:1px solid #222}
.nav a.active{background:#1a2e26;color:#d4e8a0;border-color:#d4e8a0}
.card{background:#111e1a;border:1px solid #1f352d;border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:28px} h1 span{color:#d4e8a0}
.search{display:flex;gap:8px;margin:15px 0}
.search input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#0e1a17;color:#fff}
.search button{padding:12px 18px;border-radius:10px;background:#d4e8a0;border:none;font-weight:bold}
.big{font-size:42px;font-weight:bold}
.small{color:#888;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="nav">
  <a href="./farmer.html">🌱 فلاح</a>
  <a href="./scientist.html">🔬 عالم</a>
  <a class="active" href="./picnic.html">👤 يوزر</a>
</div>

<div class="search">
  <input id="q" placeholder="اكتب نجع حمادي، طهطا، سوهاج...">
  <button onclick="search()">بحث</button>
</div>

<div id="result">
  <div style="color:#5a9d8a">● LIVE OBSERVATION</div>
  <h1>FIELD OVERVIEW / <span id="cityName">Tahta, Egypt</span></h1>
  <div class="card">NASA POWER + FIRMS<br><small id="dates">OBSERVATION 29 Aug → 24 Sept</small></div>
  <div class="card"><div>TEMPERATURE</div><div class="big"><span id="temp">29.9</span> °C</div><div class="small" id="tempDate">READING</div></div>
  <div class="card"><div>PRECIPITATION</div><div class="big"><span id="prec">0.00</span> mm/day</div></div>
  <div class="card"><div>RELATIVE HUMIDITY</div><div class="big"><span id="hum">31.4</span> %</div></div>
  <div class="card"><div>WIND SPEED</div><div class="big"><span id="wind">--</span> m/s</div></div>
</div>

<script>
async function search(){
  let q=document.getElementById('q').value||'نجع حمادي';
  let geo=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`).then(r=>r.json());
  if(!geo[0]){alert('مش لاقي البلد');return}
  let lat=geo[0].lat, lon=geo[0].lon;
  document.getElementById('cityName').innerText=geo[0].display_name;
  // NASA POWER API - اخر 7 ايام
  let end=new Date().toISOString().slice(0,10).replace(/-/g,'');
  let start=new Date(Date.now()-7*86400000).toISOString().slice(0,10).replace(/-/g,'');
  let url=`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOTCORR,RH2M,WS2M&community=AG&longitude=${lon}&latitude=${lat}&start=${start}&end=${end}&format=JSON`;
  let data=await fetch(url).then(r=>r.json());
  let last=Object.keys(data.properties.parameter.T2M).pop();
  document.getElementById('temp').innerText=data.properties.parameter.T2M[last];
  document.getElementById('prec').innerText=data.properties.parameter.PRECTOTCORR[last];
  document.getElementById('hum').innerText=data.properties.parameter.RH2M[last];
  document.getElementById('wind').innerText=data.properties.parameter.WS2M[last];
  document.getElementById('dates').innerText=`OBSERVATION ${start} → ${end} | ${lat}, ${lon}`;
}
search();
</script>
</body>
</html>
