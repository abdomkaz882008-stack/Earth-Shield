<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خروجة - طهطا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#040f0d;color:#fff;font-family:'Cairo',sans-serif}
.wrap{max-width:480px;margin:auto;padding:12px}
.card{background:#0e1d18;border:1px solid #1a332c;border-radius:18px;padding:16px;margin-bottom:12px}
.nav{display:flex;gap:8px}
.nav a{flex:1;text-align:center;padding:12px;border-radius:14px;text-decoration:none;background:#0e1d18;border:1px solid #1a332c;color:#6b8a80}
.nav a.active{color:#d6ff80;border-color:#d6ff80}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h2 id="st">⏳ جاري التحميل...</h2><p id="de" style="color:#7fa898"></p></div>
<div class="card"><div>حرارة</div><b id="t" style="font-size:28px">--</b></div>
<div class="card"><div>رياح</div><b id="w" style="font-size:28px">--</b></div>
<div class="nav"><a href="./farmer.html">🌱 فلاح</a><a href="./index.html">🔬 عالم</a><a class="active" href="./picnic.html">👤 خروجة</a></div>
</div>
<script>
fetch('https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,WS2M&community=SB&longitude=31.50&latitude=26.77&start=20250929&end=20250929&format=JSON').then(r=>r.json()).then(d=>{
let k=Object.keys(d.properties.parameter.T2M)[0];
let t=d.properties.parameter.T2M[k],w=d.properties.parameter.WS2M[k];
document.getElementById('t').innerText=t+' °C';
document.getElementById('w').innerText=w+' m/s';
document.getElementById('st').innerText=t>35||w>8?'❌ مش مناسب للخروجة':'✅ مناسب للخروجة';
document.getElementById('de').innerText=`الحرارة ${t}°C والرياح ${w} m/s - بيانات حية NASA POWER - طهطا`;
});
</script>
</body>
</html>
